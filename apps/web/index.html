<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ayuclips.</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Nothing+You+Could+Do&display=swap" rel="stylesheet"><style>:root{--bg:#0d100b;--green:#c5e98a;--muted:#a0a494;--line:#343b2d;--text:#f2f1e9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px 'DM Sans',sans-serif}.hide{display:none!important}header,footer{padding:20px max(20px,calc((100vw - 900px)/2));border-bottom:1px solid #252b20;display:flex;justify-content:space-between}.logo{font:28px 'Nothing You Could Do',cursive;color:var(--green)}main{max-width:900px;margin:auto;padding:40px 20px}.eyebrow,small,nav button,footer{font:10px 'DM Mono',monospace;letter-spacing:.08em;color:var(--muted)}h1{font-size:clamp(32px,6vw,50px);letter-spacing:-.05em;font-weight:500}em{font-family:Georgia,serif;color:var(--green)}form{display:grid;gap:14px;max-width:500px}label{display:grid;gap:7px;color:var(--muted);font:10px 'DM Mono',monospace}input,select{background:#090b08;border:1px solid var(--line);padding:13px;color:var(--text);font:14px 'DM Sans',sans-serif;border-radius:0}button{cursor:pointer;background:transparent;border:1px solid var(--line);padding:12px;color:var(--text);border-radius:0}.primary{background:var(--green);border-color:var(--green);color:#11150d;font-weight:700}.tabs{display:flex;border-bottom:1px solid var(--line);margin:24px 0}.tabs button{border:0;border-bottom:2px solid transparent}.tabs .active{color:var(--green);border-bottom-color:var(--green)}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.section{border-bottom:1px solid var(--line);padding:12px 0;color:var(--muted);font:10px 'DM Mono',monospace;display:flex;justify-content:space-between}.project{padding:18px 0;border-bottom:1px solid #252b20;display:flex;justify-content:space-between;cursor:pointer}.project b,.project small{display:block}.project small{margin-top:6px}.error{color:#f0a6a0}#activity p{padding:12px 0;border-bottom:1px solid #252b20}#activity small{display:block;margin-top:5px}#detail{border-top:1px solid var(--line);padding-top:20px}@media(max-width:550px){main{padding:26px 18px}.heading{align-items:flex-start;flex-direction:column}header,footer{padding:18px}}</style></head><body><header><a class="logo">ayuclips.</a><small>PRIVATE WORKSPACE</small></header><main><section id="gate"><p class="eyebrow">PRIVATE EDITING SPACE / 02 EDITORS</p><h1>Make the cut.<br><em>Keep the context.</em></h1><form id="join"><label>YOUR NAME<input id="name" required maxlength="40" placeholder="Name"></label><label>WORKSPACE KEY<input id="key" type="password" required placeholder="Shared private key"></label><button class="primary">Enter workspace ↗</button><p id="err" class="error"></p></form></section><section id="app" class="hide"><nav class="tabs"><button class="active" data-tab="home">01 &nbsp; Home</button><button data-tab="shared">02 &nbsp; Shared</button></nav><section id="home" class="panel"><div class="heading"><div><p class="eyebrow">TODAY</p><h1>Your editing desk.</h1></div><button id="new" class="primary">＋ New project</button></div><form id="create" class="hide"><label>PROJECT NAME<input id="title" required placeholder="Video / project name"></label><label>CLIP LENGTH<select id="length"><option value="60">01:00</option><option value="120">02:00</option><option value="150" selected>02:30</option><option value="180">03:00</option><option value="300">05:00</option></select></label><label>SOURCE VIDEO<input id="video" type="file" accept="video/*"></label><button class="primary">Create project</button><p id="create-error" class="error"></p></form><div class="section"><span>RECENT WORK</span><span>PROJECTS</span></div><div id="recent"></div></section><section id="shared-panel" class="panel hide"><div class="heading"><div><p class="eyebrow">THE WORK, IN COMMON</p><h1>Shared desk.</h1></div><button id="refresh">↻ Refresh</button></div><div class="section"><span>PROJECTS</span><span>SHARED</span></div><div id="shared-projects"></div><div class="section"><span>RECENT ACTIVITY</span><span>WORKSPACE LOG</span></div><div id="activity"></div></section><section id="detail" class="hide"><div id="detail-content"></div></section></section></main><footer><span class="logo">ayuclips.</span><span>MAKE THE CUT. KEEP THE CONTEXT.</span></footer><script type="module" src="/src/app.js"></script></body></html>
